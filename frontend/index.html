<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Toptify</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="centered">
    <section id="home">
        <h1 id="titulo-login">Tus artistas más escuchados</h1>
        <button id="login-btn" class="btn-spotify" onclick="login()">Conectar con Spotify</button>
    </section>

    <section id="top" style="display:none">
        <h1 id="titulo-top">Tus artistas más escuchados</h1>
        <div class="range-bar">
            <button class="range-btn active" onclick="update_range('short_term',this)">Último mes</button>
            <button class="range-btn" onclick="update_range('medium_term',this)">Últimos seis meses</button>
            <button class="range-btn" onclick="update_range('long_term',this)">Último año</button>
        </div>
        <div id="artists"></div>
        <button id="logout-btn" class="btn-spotify" onclick="logout()">Cerrar sesión</button>
    </section>

    <script src="/static/script.js"></script>
</body>
</html>
