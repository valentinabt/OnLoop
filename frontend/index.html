<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tus artistas más escuchados</title>
   <style>
    body {
        position: relative;
        background-color: #121212;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: 20px;
    }
    h1 { color: #1bb551; }
    #login-btn {
        background-color: #1DB954;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
    }
    #login-btn:hover { background-color: #17a349; }
    #logout-btn {
        background-color: #1DB954;
        color: white;
        border: none;
        padding: 15px 30px;
        border-radius: 25px;
        font-size: 16px;
        cursor: pointer;
        position: absolute;
        top: 20px;
        right: 20px;
    }
    #logout-btn:hover { background-color: #17a349; }
    #artists {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
    }
    .artist-card {
        background-color: #282828;
        border-radius: 10px;
        padding: 15px;
        width: 150px;
    }
    .artist-card img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
    }
    .artist-card h3 { font-size: 14px; margin: 10px 0 5px; }
    .artist-card p { font-size: 12px; color: #aaa; margin: 0; }
</style>
</head>
<body>
    <h1>Tus artistas más escuchados </h1>
    <button id="login-btn" onclick="login()" style="display:none">Conectar con Spotify</button>
    <button id="logout-btn" onclick="logout()" style="display:none; position:absolute; top:20px; right:20px;">Cerrar sesión</button>
    <div id="artists"></div>

    <script>
        function login() {
    window.location.href = "http://127.0.0.1:8000/login";
}
        function logout() {
    window.location.href = "http://127.0.0.1:8000/logout";
}

async function loadArtists() {
    const response = await fetch("http://127.0.0.1:8000/top-artists", {
        credentials: "include"
    });
    const data = await response.json();
    if (data.error) {
    document.getElementById("login-btn").style.display = "block";
    return;
}

    const container = document.getElementById("artists");
    container.innerHTML = "";

    data.forEach(artist => {
        container.innerHTML += `
            <div class="artist-card">
                <img src="${artist.image || 'https://via.placeholder.com/150'}" alt="${artist.name}">
                <h3>${artist.name}</h3>
            </div>
        `;
    });
    document.getElementById("logout-btn").style.display = "block";
}

    loadArtists();
    
    
    </script>
</body>
</html>
